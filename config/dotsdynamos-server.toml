[generation]
	#Base RF/t for Sterling Dynamo
	# Default: 20
	# Range: 1 ~ 10000
	sterlingBaseRFt = 20
	#Base RF/t for Magmatic Dynamo
	# Default: 40
	# Range: 1 ~ 10000
	magmaticBaseRFt = 40
	#Base RF/t for Steam Dynamo
	# Default: 40
	# Range: 1 ~ 10000
	steamBaseRFt = 40
	#Base RF/t for Compression Dynamo
	# Default: 40
	# Range: 1 ~ 10000
	compressionBaseRFt = 40

[tiers]
	#Output multiplier for Basic tier
	# Default: 1.0
	# Range: 0.1 ~ 100.0
	basicMultiplier = 1.0
	#Output multiplier for Hardened tier
	# Default: 1.5
	# Range: 0.1 ~ 100.0
	hardenedMultiplier = 1.5
	#Output multiplier for Reinforced tier
	# Default: 2.0
	# Range: 0.1 ~ 100.0
	reinforcedMultiplier = 2.0
	#Output multiplier for Signalum tier
	# Default: 3.0
	# Range: 0.1 ~ 100.0
	signalumMultiplier = 3.0
	#Output multiplier for Resonant tier
	# Default: 4.0
	# Range: 0.1 ~ 100.0
	resonantMultiplier = 4.0

[augments]
	#Ignition Plugs: output multiplier
	# Default: 1.5
	# Range: 1.0 ~ 10.0
	ignitionPlugsOutputMult = 1.5
	#Ignition Plugs: fuel consumption multiplier
	# Default: 1.25
	# Range: 1.0 ~ 10.0
	ignitionPlugsFuelMult = 1.25
	#Fuel Catalyzer: total energy from fuel multiplier
	# Default: 1.3
	# Range: 1.0 ~ 10.0
	fuelCatalyzerEnergyMult = 1.3
	#Amplifier: output multiplier per augment (exponential)
	# Default: 2.0
	# Range: 1.0 ~ 10.0
	amplifierOutputMult = 2.0
	#Amplifier: fuel consumption multiplier per augment (exponential)
	# Default: 2.0
	# Range: 1.0 ~ 10.0
	amplifierFuelMult = 2.0

[storage]
	#Energy storage for Basic tier (FE)
	# Default: 40000
	# Range: 1000 ~ 100000000
	basicEnergyStorage = 40000
	#Energy storage for Hardened tier (FE)
	# Default: 80000
	# Range: 1000 ~ 100000000
	hardenedEnergyStorage = 80000
	#Energy storage for Reinforced tier (FE)
	# Default: 160000
	# Range: 1000 ~ 100000000
	reinforcedEnergyStorage = 160000
	#Energy storage for Signalum tier (FE)
	# Default: 320000
	# Range: 1000 ~ 100000000
	signalumEnergyStorage = 320000
	#Energy storage for Resonant tier (FE)
	# Default: 640000
	# Range: 1000 ~ 100000000
	resonantEnergyStorage = 640000

[compression]
	#Additional fluid registry names accepted as Compression Dynamo fuel.
	#Fluids matching tags forge:biofuel, forge:ethanol, c:biofuel, c:ethanol are always accepted.
	#Fluids with 'ethanol' or 'biofuel' in their registry name are always accepted.
	#Add extra fluid IDs here, e.g. ["mekanism:ethanol", "industrialforegoing:biofuel"]
	additionalFuels = ["mekanism:ethanol", "industrialforegoing:biofuel"]
